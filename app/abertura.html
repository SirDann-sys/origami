<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Origami</title>
<style>
  :root { --navy:#0e1626; --navy2:#182842; --vio:#a770ff; --creme:#f4ebdf; --sutil:#8f9bb5; }
  html, body { margin:0; height:100%; background:var(--navy); color:var(--creme); font-family:"Segoe UI", system-ui, sans-serif;
    -webkit-app-region:drag; user-select:none; overflow:hidden; }
  .c { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    background:radial-gradient(circle at 50% 38%, var(--navy2) 0%, var(--navy) 70%); }
  img { width:112px; animation:voo 2.4s ease-in-out infinite; filter:drop-shadow(0 10px 18px rgba(0,0,0,.45)); }
  h1 { margin:0; font-size:22px; letter-spacing:.32em; font-weight:700; padding-left:.32em; }
  p { margin:0; font-size:12px; color:var(--sutil); letter-spacing:.04em; }
  .barra { width:150px; height:3px; border-radius:3px; background:#24324d; overflow:hidden; }
  .barra i { display:block; width:40%; height:100%; background:var(--vio); border-radius:3px; animation:corre 1.3s ease-in-out infinite; }
  @keyframes voo { 0%,100% { transform:translateY(0) rotate(-2deg); } 50% { transform:translateY(-8px) rotate(2deg); } }
  @keyframes corre { 0% { transform:translateX(-100%); } 100% { transform:translateX(260%); } }
  @media (prefers-reduced-motion: reduce) { img, .barra i { animation:none; } }
</style>
</head>
<body>
<div class="c">
  <img src="../interface/origami.svg" alt="">
  <h1>ORIGAMI</h1>
  <div class="barra"><i></i></div>
  <p>ligando o motor…</p>
</div>
</body>
</html>
